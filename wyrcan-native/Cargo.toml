[package]
name = "wyrcan-native"
# Spike: wyrcan as its own terminal workspace (no zellij). Binary is `wyrcan`.
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29", features = ["serde"] }
ghostty-vt = "0.8.0"
libc = "0.2"
portable-pty = "0.9"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bin]]
name = "wyrcan"
path = "src/main.rs"
