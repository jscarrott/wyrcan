[package]
name = "wyrcan-native"
# Spike: wyrcan as its own terminal workspace (no zellij). Binary is `wyrcan`.
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
libc = "0.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bin]]
name = "wyrcan"
path = "src/main.rs"
