[package]
name = "wyrcan-todo"
version = "0.1.6"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A todo manager for managing todotxt based files"

[[bin]]
name = "wyrcan"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.38"
clap = "4.5.14"
crossterm = "0.28.1"
directories = "5.0.1"
eyre = "0.6.12"
figment = { version = "0.10.19", features = ["toml"] }
ratatui = "0.28.0"
serde = { version = "1.0.205", features = ["derive"] }
serde_json = "1.0.122"
strum = { version = "0.26.3", features = ["derive"] }
strum_macros = "0.26.4"
todo_lib = "7.2.0"
tui-input = "0.10.0"
